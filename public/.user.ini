; Custospark Academy upload limits (shared hosting reads .user.ini per directory).
; Lesson videos run to 100MB: keep PHP above that so big uploads fail with a
; clean 422 from validation instead of a dropped connection.
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
