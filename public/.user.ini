; Custospark Academy upload limits (shared hosting reads .user.ini per directory).
; Lesson videos run to 100MB on slow connections: allow up to 1 hour so big
; uploads fail with a clean 422 from validation instead of a dropped connection.
; Web-server idle timeouts (nginx fastcgi_read_timeout / Apache Timeout) must
; also allow 3600s for these routes - see DEPLOYMENT.md.
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 3600
max_input_time = 3600
memory_limit = 512M
